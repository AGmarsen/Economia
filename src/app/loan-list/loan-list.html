@for(loan of accountantService.loans(); track loan; let i = $index) {

<div class="flex">
    <input class="editable-label" [value]="loan.label" (input)="loan.label = $event.target.value"
        placeholder="Loan name" />
    <div>
        <p>Amount</p>
        <input #amountInput class="parameter-field" type="number"
            (input)="loan.amount = amountInput.valueAsNumber; accountantService.setLoanAmount(loan, loan.amount)"
            [value]="util.roundTwoDecimals(loan.amount)" />
    </div>
    <div>
        <p>Coverage %</p>
        <input #coverageInput class="parameter-field" type="number"
            (input)="loan.coverage = coverageInput.valueAsNumber / 100; accountantService.setLoanCoverage(loan, loan.coverage)"
            [value]="util.roundTwoDecimals(loan.coverage * 100)" />
    </div>
    <div>
        <br>
        <button class="remove-button" (click)="accountantService.removeLoan(loan)">Remove</button>
    </div>
</div>
}

<button class="secondary-button" (click)="accountantService.addLoan()">Add loan</button>
