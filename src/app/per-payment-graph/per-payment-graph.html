<div class="flex flex-wrap">
  <div class="w-full lg:w-1/2 p-4">
    <h3>Payment Burndown</h3>
    <reactive-chart [type]="'line'" [chartData]="burnDownchartData()" />
  </div>
  <div class="w-full lg:w-1/2 p-4">
    <h3>Accumulated Interest vs Payment</h3>
    <reactive-chart [type]="'bar'" [chartData]="accumulatedChartData()" />
  </div>
</div>

<calculated-field label="Total interest" [value]="util.roundTwoDecimals(totalInterest())" />
<calculated-field label="Total loan payment" [value]="util.roundTwoDecimals(totalPayment())" />
