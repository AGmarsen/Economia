<main class="main">
  <div class="content m-5">
    <h1 class="text-2xl font-bold mb-4">Economia</h1>
    <!-- Top level parameters -->
    <div class="flex">
      <parameter label="Down payment" (valueChangedEvent)="accountantService.setDownPayment($event)" [value]="accountantService.getDownPayment()"/>
      <parameter label="Purchase price" (valueChangedEvent)="accountantService.setPurchasePrice($event)" [value]="accountantService.getPurchasePrice()"/>
      <calculated-field label="Total loan amount" [value]="accountantService.loanAmount()"/>
    </div>

    <loan-list/>
      
  </div>
</main>


<router-outlet />
