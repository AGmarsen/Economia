<main class="main">
  <div class="content m-5">
    <h1 class="text-2xl font-bold mb-4">Economia</h1>
    <parameter label="Down payment" (valueChangedEvent)="accountantService.setDownPayment($event)"/>
    <parameter label="Purchase price" (valueChangedEvent)="accountantService.setInvestmentSum($event)"/>

    <calculated-field label="Calculated loan" [value]="accountantService.loanAmount()"/>
    <calculated-field [label]="'Mortgage loan (' + (accountantService.mortgageCover() * 100) + '%)'" [value]="accountantService.mortgageLoan()"/>
    <calculated-field label="Bank loan" [value]="accountantService.bankLoan()"/>
  </div>
</main>


<router-outlet />
