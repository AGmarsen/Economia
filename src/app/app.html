<main class="main">
  <div class="content m-5">
    <h1 class="text-2xl font-bold mb-4">Economia</h1>

    <div>
      <p>Purchase price</p>
      <input #purchasePrice class="parameter-field" label="Purchase price" type="number" (input)="accountantService.setPurchasePrice(purchasePrice.valueAsNumber)"
        [value]="accountantService.getPurchasePrice()" />
    </div>

    <div class="flex">
      <input class="editable-label" value="Down payment" />
      <div> 
        <p>Amount</p>
      <input #downPayment class="parameter-field" type="number" label="Amount" (input)="accountantService.setDownPayment(downPayment.valueAsNumber)"
        [value]="util.roundTwoDecimals(accountantService.getDownPayment())" />
        </div>
      <div>
        <p>Coverage %</p>
      <input class="parameter-field" type="number" label="Coverage %" [value]="util.roundTwoDecimals(accountantService.downPaymentPercentage() * 100)" />
      </div>
    </div>
    <loan-list />
    <calculated-field label="Total loan amount" [value]="accountantService.totalLoan()" />

  </div>
</main>


<router-outlet />
